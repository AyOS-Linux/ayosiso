# AyOS Material 26.11 — settings.conf
# Формат сверён по исходникам Calamares 3.4 (Settings.cpp) и upstream settings.conf:
#  - top-level "sequence" = список {show: [...]}/{exec: [...]}
#  - "modules-search: [ local ]" ОБЯЗАТЕЛЕН: без него "Found 0 modules"
#  - required-ключи: prompt-install, dont-chroot, oem-setup, disable-cancel,
#    disable-cancel-during-exec, hide-back-and-next-during-exec, quit-at-end
---
modules-search: [ local ]

branding: ayos

instances:
    - id: ayos_osrelease
      module: shellprocess
      config: shellprocess_ayos_osrelease.conf
    - id: ayos_angelos
      module: shellprocess
      config: shellprocess_ayos_angelos.conf
    - id: kernel          # выбор ядра (linux/linux-lts/linux-zen) -> GS packagechooser_kernel
      module: packagechooser
      config: packagechooser@kernel.conf
    - id: packages        # чекбоксы опционального софта -> GS packageOperations
      module: netinstall
      config: netinstall@packages.conf

# Стандартные ключи установщика (upstream-дефолты)
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false

# Модули с UI, показываемые в сайдбаре установщика
sequence:
    - show:
        - welcome
        - locale
        - keyboard
        - packagechooser
        - packagechooser@kernel
        - netinstall@packages
        - partition
        - users
        - summary

    # Фазы выполнения установки
    - exec:
        - partition
        - mount
        - packagechooser   # фиксирует выбор редакции в GlobalStorage (exec-фазы не имеет,
                           # но должен стоять в exec для instances-регистрации;
                           # ПЕРЕД ayospacstrap: тот читает GS и подмешивает пакеты
                           # редакции в pacstrap - тяжёлые загрузки идут по видимой
                           # полосе прогресса, а не молча в shellprocess'е)
        - packagechooser@kernel  # выбор ядра в GS (exec-фазы не имеет, как выше)
        - netinstall@packages    # собранные чекбоксы уже в GS (packageOperations)
        - ayospacstrap    # настоящая установка: pacstrap свежей системы из репозиториев
                          # в mounted-target (базис + firmware + сеть + аудио + драйверы
                          # + наборы выбранной редакции). Вместо копии squashfs
                          # (unpackfs убран). fstab-модуль ниже генерирует /etc/fstab -
                          # это тот же результат, что genfstab.
        - machineid
        - fstab
        - locale
        - keyboard
        - localecfg
        - shellprocess@ayos_osrelease # финальный os-release ДО установки пакетов:
                                      # kernel-install (сборка boot-записи в ходе
                                      # pacman-транзакции) берёт заголовок из PRETTY_NAME
        - contextualprocess # выбор редакции -> /usr/local/bin/ayos-edition <id>:
                            # ставит пакеты редакции И ВОССТАНАВЛИВАЕТ ядро (linux)
                            # в /boot; ДОЛЖЕН выполняться до initcpiocfg/initcpio
        - initcpiocfg      # Arch-native: настройки mkinitcpio
        - initcpio         # запуск mkinitcpio в целевой системе
        - luksbootkeyfile
        - users
        - hwclock
        - services-systemd
        - packages         # статические операции + packageOperations из GS
        - bootloader       # systemd-boot (UEFI)
        - shellprocess@ayos_angelos
        - displaymanager   # enable sddm/gdm/lightdm в целевой системе
        - umount

    - show:
        - finished
