# AyOS Material 26.11 — shellprocess ayos_osrelease
# Пишет финальный /etc/os-release в целевую систему по выбранной редакции.
# Выбор редакции читается из GlobalStorage (gs[packagechooser_packagechooser]).
---
dontChroot: false
timeout: 86400

script:
    - command: /usr/local/bin/ayos-osrelease "${gs[packagechooser_packagechooser]}"
      timeout: 86400
