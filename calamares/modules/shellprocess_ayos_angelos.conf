# AyOS Material 26.11 — shellprocess ayos_angelos
# Автоматическая установка AngelOS (niri + Quickshell + dotfiles) в chroot
# целевой системы ПОСЛЕ распаковки базовой системы и установки пакетов,
# ДО umount. Запускается всегда, но внутри сам выходит, если редакция не Angel.
#
# Переменные Calamares: ${USER} — имя пользователя со страницы users.
# Locale/timezone уже применены модулями locale/localecfg — скрипт берёт их
# из /etc/locale.conf и /etc/localtime целевой системы (надёжнее, чем дублировать).
---
dontChroot: false
timeout: 86400

script:
    - command: /usr/local/bin/ayos-angelos "${gs[packagechooser_packagechooser]}" "${USER}"
      timeout: 86400
