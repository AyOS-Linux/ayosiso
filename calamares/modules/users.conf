# AyOS Material 26.11 — users.conf
---
# Параметры согласованы с официальным users.conf Calamares 3.3.
#
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - wheel
    - audio
    - video
    - optical
    - storage
    - input
    - lp
    - network
    - power

sudoersGroup: wheel
setRootPassword: true
doReusePassword: true
doAutologin: false

passwordRequirements:
    minLength: -1
    maxLength: -1
    libpwquality:
        - minlen=0
        - minclass=0

allowWeakPasswords: true
allowWeakPasswordsDefault: true

user:
    shell: /bin/bash
    forbidden_names: [ root, nobody ]
    home_permissions: "o700"

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "ayos-${cpu}"
    forbidden_names: [ localhost ]
