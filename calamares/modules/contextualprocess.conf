# AyOS Material 26.2 — contextualprocess: превращает выбор редакции
# (GS key packagechooser_packagechooser) в вызов /usr/local/bin/ayos-edition.
# Формат value-checks подтверждён по официальному contextualprocess.conf (Calamares 3.3).
---
dontChroot: false
timeout: 86400

packagechooser_packagechooser:
    "everyday":
        - command: /usr/local/bin/ayos-edition everyday linux
          timeout: 86400
    "light":
        - command: /usr/local/bin/ayos-edition light linux
          timeout: 86400
    "barebone":
        - command: /usr/local/bin/ayos-edition barebone linux
          timeout: 86400
    "nebula":
        - command: /usr/local/bin/ayos-edition nebula linux
          timeout: 86400
    "*":
        - command: /bin/false unknown-edition
          timeout: 86400
