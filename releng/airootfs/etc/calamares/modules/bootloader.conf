# AyOS Material 26.11 — bootloader: systemd-boot (UEFI-only, §2)
# Проверенный вариант конфигурации Calamares 3.3 (bootloader.conf).
---
efiBootLoader: "systemd-boot"

kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"

loaderEntries:
    - "timeout 5"
    - "console-mode keep"

kernelParams: [ "quiet" ]

# BIOS/legacy не поддерживаем (§1: UEFI x86_64-only).
installEFIFallback: true
