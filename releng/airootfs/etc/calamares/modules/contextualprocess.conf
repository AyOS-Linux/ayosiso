# AyOS Material 26.11 — contextualprocess: превращает выбор редакции
# (GS key packagechooser_packagechooser) в вызов /usr/local/bin/ayos-edition.
# Формат value-checks подтверждён по официальному contextualprocess.conf (Calamares 3.3).
---
dontChroot: false
timeout: 3600

packagechooser_packagechooser:
    "everyday":
        - command: /usr/local/bin/ayos-edition everyday "${gs[packagechooser_kernel]}"
          timeout: 3600
    "light":
        - command: /usr/local/bin/ayos-edition light "${gs[packagechooser_kernel]}"
          timeout: 3600
    "angel":
        - command: /usr/local/bin/ayos-edition angel "${gs[packagechooser_kernel]}"
          timeout: 3600
    "barebone":
        - command: /usr/local/bin/ayos-edition barebone "${gs[packagechooser_kernel]}"
          timeout: 3600
    "nebula":
        - command: /usr/local/bin/ayos-edition nebula "${gs[packagechooser_kernel]}"
          timeout: 3600
    "*":
        - command: /bin/false unknown-edition
          timeout: 10
