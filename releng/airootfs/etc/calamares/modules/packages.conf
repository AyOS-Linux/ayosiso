# AyOS Material 26.11 — packages.conf
# backend pacman; наборы пакетов редакций ставит /usr/local/bin/ayos-edition
# (вызывается из contextualprocess), поэтому статические операции не нужны.
# update_system выключен: распакованная squashfs уже консистентна,
# сетевые обновления не должны ломать воспроизводимость установки.
---
backend: pacman

skip_if_no_internet: true
update_db: false
update_system: false

pacman:
    num_retries: 3
    disable_download_timeout: false
    needed_only: true
