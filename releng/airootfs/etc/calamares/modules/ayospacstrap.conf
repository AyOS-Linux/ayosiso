# AyOS Material 26.11 — ayospacstrap.conf
#
# ОБЩИЙ базис для всех редакций: ставится pacstrap'ом из репозиториев Arch.
# Это live-нейтральный «ось»: ядро+firmware, сеть, звук, драйверы видеокарт,
# утилиты. Редакционные наборы (плазма/xfce/gnome/niri/сервер) alphabит к
# этому в /usr/local/bin/ayos-edition — их значениями остаются дельты.
#
# ВАЖНО: linux здесь НЕ указан - ядро ставится позже в ayos-edition,
# чтобы boot-запись (kernel-install) называлась по AyOS os-release и
# initramfs собрался уже с чистой конфигурацией и готовым keyring'ом.
#
# Пины-детерминизм (не зависеть от дефолтов при pacman 'providers'):
# mkinitcpio (= провайдер initramfs), pipewire-jack (= jack),
# iptables (= iptables) - иначе pacman выбирает дефолт по порядку репо,
# что отличается между хостом и чистым pacman.conf цели.
---
packages:
    - base
    - base-devel
    - mkinitcpio
    - linux-firmware
    - amd-ucode
    - intel-ucode
    - sudo
    - nano
    - vim
    - git
    - wget
    - curl
    - networkmanager
    - network-manager-applet
    - nm-connection-editor
    - wpa_supplicant
    - iwd
    - wireless-regdb
    - iptables
    - polkit
    - accountsservice
    - xdg-user-dirs
    - xdg-utils
    - xdg-desktop-portal
    - xdg-desktop-portal-gtk
    - pipewire
    - pipewire-pulse
    - pipewire-alsa
    - pipewire-jack
    - wireplumber
    - sof-firmware
    - alsa-firmware
    - alsa-utils
    - gstreamer
    - gst-plugins-good
    - gst-plugins-bad
    - gst-plugins-ugly
    - gst-libav
    - ffmpeg
    - bluez
    - bluez-utils
    - bluez-obex
    - mesa
    - vulkan-radeon
    - vulkan-intel
    - vulkan-mesa-implicit-layers
    - intel-media-driver
    - libva-intel-driver
    - xf86-video-amdgpu
    - nvidia-utils
    - nvidia-settings
    - btrfs-progs
    - dosfstools
    - e2fsprogs
    - exfatprogs
    - f2fs-tools
    - xfsprogs
    - efibootmgr
    - fastfetch
    - zram-generator

# Наборы редакций: main.py подмешивает их к списку packages (читает GS
# packagechooser_packagechooser). Идентичны спискам ayos-edition, НО без
# nvidia-* и без linux: те ставит ayos-edition в target-фазе, где уже
# готов AyOS os-release (nvidia жёстко тянет ядро зависимостью).
editions:
    everyday: [plasma-meta, dolphin, konsole, kate, discover, sddm, sddm-kcm, plasma-nm, plasma-pa, xdg-desktop-portal-kde, firefox, kdegraphics-thumbnailers, ffmpegthumbs]
    light: [xfce4, thunar, xfce4-terminal, mousepad, lightdm, lightdm-gtk-greeter, xdg-desktop-portal-gtk, firefox]
    nebula: [gnome, nautilus, gnome-terminal, gedit, gnome-software, gdm, xdg-desktop-portal-gnome, firefox]
    angel: [niri, xwayland-satellite, swaybg, swaylock, swayidle, xorg-xwayland, fish]
    barebone: [networkmanager, nano, base-devel, git]
