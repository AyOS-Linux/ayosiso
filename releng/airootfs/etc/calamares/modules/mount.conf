# AyOS Material 26.11 — mount.conf
# Привязки окружения в chroot целевой системы.
# КРИТИЧНО: bind /run — иначе /etc/resolv.conf в цели (симлинк из squashfs
# на /run/systemd/resolve/stub-resolv.conf) остаётся «висящим» и pacman
# в chroot не может резолвить зеркала (Could not resolve host).
---
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: /run
      mountPoint: /run
      options: [ bind ]

extraMountsEfi:
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
